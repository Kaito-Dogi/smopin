name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-lint:
    name: Android Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Create local.properties
        run: |
          cat <<'EOF' > local.properties
          GOOGLE_MAPS_API_KEY=xxx
          EOF
      - name: Create google-services.json
        run: printf '{}' > android/app/google-services.json
      - name: Run Android Lint
        run: ./gradlew lintDebug

  unit-test:
    name: Unit Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Create local.properties
        run: |
          cat <<'EOF' > local.properties
          GOOGLE_MAPS_API_KEY=xxx
          EOF
      - name: Run Unit Test
        run: ./gradlew testDebug
